app:
  description: 基于四份虚拟企业样例文档的 Dify 原生知识库问答
  icon: 📚
  icon_background: '#E4F1E9'
  icon_type: emoji
  mode: chat
  name: Day22 企业制度简化问答
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
