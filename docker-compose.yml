services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise-rag-agent-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    environment:
      # 大模型服务配置：默认从宿主机 .env 或环境变量读取
      BASE_URL: ${BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      N8N_WEBHOOK_TIMEOUT_SECONDS: ${N8N_WEBHOOK_TIMEOUT_SECONDS:-10}

      # Embedding 与向量检索配置
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      VECTOR_STORE_DIR: /app/data/chroma
      HF_HOME: /app/data/huggingface
      RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-keyword}
      RAG_STORE_TTL_SECONDS: ${RAG_STORE_TTL_SECONDS:-3600}
      RAG_STORE_MAX_SESSIONS: ${RAG_STORE_MAX_SESSIONS:-50}
      RAG_PREVIEW_TEXT_LIMIT: ${RAG_PREVIEW_TEXT_LIMIT:-120}
      RAG_VECTOR_SCORE_THRESHOLD: ${RAG_VECTOR_SCORE_THRESHOLD:-0.6}
      RAG_KEYWORD_FALLBACK_ENABLED: ${RAG_KEYWORD_FALLBACK_ENABLED:-true}

      # SQLite 数据库配置：写入挂载的 /app/data/app.db
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      # 挂载 data 目录，持久化 SQLite 数据库和 data/chroma 向量库
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  frontend:
    profiles: [legacy-streamlit]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise-rag-agent-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    environment:
      # 容器网络里通过服务名 backend 访问后端，不能使用 127.0.0.1
      FRONTEND_BACKEND_BASE_URL: http://backend:8000
    volumes:
      # 前端也挂载 data，保证导入和状态读取路径一致
      - ./data:/app/data

  n8n:
    image: n8nio/n8n:stable
    profiles: [automation]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
